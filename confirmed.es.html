<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <title>IpsoFit — Email confirmado</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23ff6b4a'/%3E%3C/svg%3E">
  <style>
    body { font-family: system-ui, sans-serif; background: #2F384B; color: #fff; margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center; }
    main { max-width: 480px; padding: 32px 16px; }
    h1 { font-size: 22px; margin: 0 0 8px; }
    h2 { font-size: 18px; font-weight: 400; margin: 0; color: #cfd6e4; }
  </style>
</head>
<body>
  <main>
    <h1>IpsoFit</h1>
    <h2 id="message"></h2>
  </main>
  <script>
    const CONFIRMED = "Email confirmado. Vuelve a IpsoFit e inicia sesión.";
    const EXPIRED = "Este enlace ha caducado o ya se usó. Abre IpsoFit y pide uno nuevo.";

    let failed = false;
    try {
      const params = new URLSearchParams(`${location.search.slice(1)}&${location.hash.slice(1)}`);
      failed = ["error", "error_code", "error_description"].some((key) => params.has(key));
    } catch (_) {
      // malformed hash: show the success view
    }
    document.getElementById("message").textContent = failed ? EXPIRED : CONFIRMED;
  </script>
</body>
</html>
